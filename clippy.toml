# clippy.toml (DOLL-652)
#
# Clippy uses the first clippy.toml it finds walking up from the crate's
# manifest directory, with no merging. This crate is a single package, so this
# file is the whole config. The lint *levels* live in Cargo.toml [lints.*];
# this file holds thresholds, per-test relief, and the hard bans.
#
# Verify a ban fires by writing one deliberate violation the first time you
# add it; path resolution through std re-exports changes between clippy releases.

msrv = "1.98"                       # match rust-version in Cargo.toml and the CI MSRV lane

# Test code gets the shortcuts production code does not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
allow-useless-vec-in-tests = true

# Complexity budgets. Agents pad functions and thread booleans through signatures.
# These are ratcheted to the tightest value the current tree passes at (measured,
# not guessed), so the ceiling can only come DOWN as code improves — never drift
# up. Re-measure with an aggressive probe run before lowering further.
#   too-many-lines 80 -> 73   : longest fn is 73 lines; frozen there.
#   type-complexity 200 -> 160: measured across all three feature sets; the two
#                               worst types live in bench_writer.rs (~150-160).
#   cognitive-complexity -> 15: currently non-binding (the lint stays quiet on this
#                               tree even at 1), kept low so it bites if it activates.
# At their floor already (tightening needs code changes, deliberately NOT done to
# avoid churn): too-many-arguments 6 (6 fns take 6 args), excessive-nesting 5
# (~22 sites at depth 5).
too-many-arguments-threshold = 6
too-many-lines-threshold = 73
cognitive-complexity-threshold = 15
type-complexity-threshold = 160
excessive-nesting-threshold = 5
max-fn-params-bools = 2
max-struct-bools = 3
enum-variant-size-threshold = 200
large-error-threshold = 128
struct-field-name-threshold = 3

# Audio callback and writer thread run on small stacks; keep frames small.
stack-size-threshold = 65536
array-size-threshold = 8192

# A SAFETY: comment may sit above the statement or attribute, not only the block.
accept-comment-above-statement = true
accept-comment-above-attributes = true

# Float literal readability: 0.123456 does not need separators, 1234567.0 does.
unreadable-literal-lint-fractions = false

# Make uninlined_format_args strict: no mix of inline and positional args.
allow-mixed-uninlined-format-args = false

# Keep clippy's default identifier list and add Apple / project vocabulary so
# doc_markdown stops demanding backticks around ordinary words.
doc-valid-idents = [
  "..",
  "macOS", "iOS", "SwiftUI", "AppKit", "CoreAudio", "AudioUnit", "AudioToolbox",
  "TestFlight", "GitHub", "OpenAPI",
  "BlackBox", "MacBook", "SemVer",          # product and brand names, not identifiers (DOLL-653)
]

# Hard bans. Each carries a reason so the diagnostic teaches the agent.
# Deliberate exceptions use #[expect(clippy::disallowed_methods, reason = "...")]
# at the call site (e.g. the writer thread's bounded drain backoff, DOLL-251).
disallowed-methods = [
  { path = "std::thread::sleep", reason = "sleeping is not synchronization; use channels, condvars, atomics, or the host clock (test_utils has wait helpers)" },
  { path = "std::env::home_dir", reason = "the sandboxed app gets paths from Swift via security-scoped bookmarks; the CLI takes an explicit output_dir" },
  { path = "f32::partial_cmp", reason = "use total_cmp; partial_cmp().unwrap() panics on NaN" },
  { path = "f64::partial_cmp", reason = "use total_cmp; partial_cmp().unwrap() panics on NaN" },
  # This app runs an audio callback, a writer thread and a silence worker
  # concurrently. Mutating the process environment from any of them is a data
  # race (and is `unsafe` in edition 2024). Tests set env via the temp-env crate.
  { path = "std::env::set_var", reason = "process-wide env mutation is a data race across the audio/writer/silence threads; use Config or the temp-env crate in tests" },
  { path = "std::env::remove_var", reason = "process-wide env mutation is a data race across the audio/writer/silence threads; use Config or the temp-env crate in tests" },
]
