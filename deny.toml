# cargo-deny configuration (DOLL-652). Run: cargo deny check
#
# Replaces the cargo-audit lane: advisories (RUSTSEC), licenses, duplicate
# and wildcard bans, and registry sources in one pass. Every exemption goes
# here with a reason and, for advisories, an expiry note.

[graph]
all-features = true

[advisories]
# Unmaintained / yanked / notice advisories fail the check, matching the old
# `cargo audit --deny warnings` behaviour (deps that age out must be replaced,
# not ignored). Add a temporary `ignore = ["RUSTSEC-..."]` with a rationale and
# a removal date if one blocks a release.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Everything the shipped dependency tree uses today. Adding a license here is
# a conscious decision; ACKNOWLEDGMENTS.md is regenerated from the same tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = [
  # This crate itself. BUSL-1.1 is not a dependency license we accept.
  { allow = ["BUSL-1.1"], crate = "blackbox" },
]

[bans]
# Duplicates are reported with the full dependency path, which is why this is
# here rather than clippy::multiple_crate_versions.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
